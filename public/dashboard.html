<script src="./js/modal.js"></script>
<script>
    let labels = [];

    let dados = [];

    // Cada zona tem um valor inicial (from), valor final (to) e a cor de fundo (color)
    let Zonas = [
        { from: 0, to: 50, color: 'rgba(0, 200, 80, 0.10)' }, // Verde -> nível normal (0% a 50%)
        { from: 50, to: 75, color: 'rgba(255, 200, 0, 0.15)' }, // Amarelo -> atenção (50% a 75%)
        { from: 75, to: 100, color: 'rgba(255, 50, 50, 0.15)' }, // Vermelho -> crítico (75% a 100%)
    ];

    // Plugin inline do Chart.js, ele que desenha as zonas coloridas antes de qualquer dado aparecer
    let fundoZonas = {
        id: 'fundoZonas',

        // Executa antes do gráfico ser desenhado
        beforeDraw(chart) {
            let { ctx, chartArea: { left, right }, scales: { y } } = chart;

            // Faixa verde 0% a 50%
            let yTop = y.getPixelForValue(Zonas[0].to);
            let yBottom = y.getPixelForValue(Zonas[0].from);
            ctx.fillStyle = Zonas[0].color;
            ctx.fillRect(left, yTop, right - left, yBottom - yTop);

            // Faixa amarela 50% a 75%
            yTop = y.getPixelForValue(Zonas[1].to);
            yBottom = y.getPixelForValue(Zonas[1].from);
            ctx.fillStyle = Zonas[1].color;
            ctx.fillRect(left, yTop, right - left, yBottom - yTop);

            // Faixa vermelha 75% a 100%
            yTop = y.getPixelForValue(Zonas[2].to);
            yBottom = y.getPixelForValue(Zonas[2].from);
            ctx.fillStyle = Zonas[2].color;
            ctx.fillRect(left, yTop, right - left, yBottom - yTop);
        }
    };
    var sensorDigital = new Chart(document.getElementById('sensorDigital').getContext('2d'), {
        type: 'line',
        plugins: [fundoZonas], // registra o plugin apenas neste gráfico
        options: {
            scales: {
                x: { beginAtZero: true },
                y: {
                    title: { display: true, text: '(0%-100%)' },
                    beginAtZero: true,
                    max: 100
                }
            }
        }
    });

    function atualizarGrafico(novosDados, nomeLixeira, novosLabels) {
        sensorDigital.data.datasets = []; // limpa todos os datasets anteriores
        sensorDigital.data.datasets.push({
            label: nomeLixeira,
            data: novosDados,
            borderColor: '#63B1BC',
            backgroundColor: '#63B1BC33',
        });
        sensorDigital.data.labels = novosLabels;
        sensorDigital.update();
    }

    function atualizarGraficoFiltrado(dados) {
        var grupos = {};

        for (let i = 0; i < dados.length; i++) {
            var nome = dados[i].nome_lixeira;

            // Cria o grupo se ainda não existir
            if (!grupos[nome]) {
                grupos[nome] = { labels: [], valores: [] };
            }

            // Pega apenas o horário da medição
            let dataStr = dados[i].data_medicao.toString().substring(0, 16);
            let partes = dataStr.split("T");
            let dataFormatada = partes[1];

            // Salva horário e volume
            grupos[nome].labels.push(dataFormatada);
            grupos[nome].valores.push(dados[i].volume_percentual);
        }
var cores = ['#5B8DEF', '#9B5DE5', '#F4A261','#577590','#C77DFF', '#4895EF' ];

        // Cria uma linha para cada lixeira
        var datasets = Object.keys(grupos).map(function (nome, i) {
            return {
                label: nome,
                data: grupos[nome].valores,
                borderColor: cores[i % cores.length],
                backgroundColor: cores[i % cores.length] + '33',
            };
        });

        // Usa os horários da primeira lixeira no eixo X
        var labelsComuns = grupos[Object.keys(grupos)[0]].labels;

        sensorDigital.data.labels = labelsComuns;
        sensorDigital.data.datasets = datasets;
        sensorDigital.update();
    }
</script>
