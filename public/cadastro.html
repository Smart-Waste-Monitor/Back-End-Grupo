<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro Hospitalar</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/cadastro.css">
  <link rel="icon" type="image/png" href="./imgs/logo.png">
</head>
<body onload="listar()">
  <nav>
      <img src="imgs/logo.png" alt="Logo da Smart Waste Systems" class="logo">

      <div class="titulo">
          <p>Smart Waste Systems</p>
      </div>

      <div class="links">
          <a href="index.html" class="escolhaLinks">Home</a>
          <a href="v1calculadora.html" class="escolhaLinks">Calculadora de Retorno</a>
          <a href="login.html" class="escolhaLinks login">Login</a> 
      </div>
    </nav>

  <div class="alerta_erro"> 

    <div class="card_erro" id="cardErro">
      <span id="fechar" onclick="sumirMensagem()">&times;</span>
      <span id="mensagem_erro"></span>
    </div>
  </div>

  <section class="card">
    <div class="forms">
      <form id="login-form" class="form">
        <h2>Cadastre-se aqui!</h2>
        Nome Completo: <br>
        <input type="text" id="nome_completo">
        Senha: <br>
        <input type="password" id="senha_imp">
        Confirmar Senha: <br>
        <input type="password" id="confirmar_senha">
        E-mail: <br>
        <input type="email" id="email">
        Código do hospital: <br>
        <input type="text" id="Cod_hospital_imp">

        <button type="button" onclick="cadastrar()">Cadastrar</button>
      </form>
        <p class="com-cadastro">Já possuo conta!  <a href="login.html">Fazer Login</a></p>
    </div>
  </section>
</body>
</html>

<script src="./js/cadastro.js"></script>
