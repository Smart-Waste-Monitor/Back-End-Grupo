<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura resumida do Smart Waste</title>
  <desc id="description">Sensor ultrassônico e Arduino compõem a aquisição proposta. A integração prevista conecta o hardware à API Node.js e Express. A API se comunica com MySQL e com a interface JavaScript e Chart.js, que apresenta leituras e alertas.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#466575" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1118" height="538" rx="12" fill="#f7f9fb" stroke="#d7e1e8"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="49" fill="#142c3b" font-size="28" font-weight="700">Smart Waste</text>
    <text x="40" y="77" fill="#466575" font-size="17">Arquitetura resumida da proposta</text>
    <text x="40" y="112" fill="#466575" font-size="15" font-weight="700">Aquisição proposta</text>
    <text x="740" y="112" fill="#466575" font-size="15" font-weight="700">Aplicação web</text>
  </g>

  <g fill="none" stroke="#466575" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 185H330" marker-end="url(#arrow)"/>
    <path d="M580 185H730" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
    <path d="M900 245V350" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M730 221H680V410H630" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M330 410H290" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="40" y="135" width="240" height="100" rx="7" fill="#fff" stroke="#aebfca"/>
    <text x="160" y="178" fill="#142c3b" font-size="21" font-weight="700">Sensor ultrassônico</text>
    <text x="160" y="206" fill="#466575" font-size="16">Nível de preenchimento</text>

    <rect x="340" y="135" width="240" height="100" rx="7" fill="#fff" stroke="#aebfca"/>
    <text x="460" y="178" fill="#142c3b" font-size="22" font-weight="700">Arduino</text>
    <text x="460" y="206" fill="#466575" font-size="16">Aquisição de medições</text>

    <text x="655" y="158" fill="#466575" font-size="15">Integração prevista</text>

    <rect x="740" y="135" width="320" height="100" rx="7" fill="#e4eef6" stroke="#8baabd"/>
    <text x="900" y="178" fill="#173e58" font-size="23" font-weight="700">API</text>
    <text x="900" y="206" fill="#365f79" font-size="18">Node.js / Express</text>

    <rect x="740" y="360" width="320" height="100" rx="7" fill="#fff" stroke="#aebfca"/>
    <text x="900" y="403" fill="#142c3b" font-size="22" font-weight="700">Banco de dados</text>
    <text x="900" y="431" fill="#466575" font-size="18">MySQL</text>

    <rect x="340" y="360" width="280" height="100" rx="7" fill="#e4eef6" stroke="#8baabd"/>
    <text x="480" y="403" fill="#173e58" font-size="22" font-weight="700">Interface web</text>
    <text x="480" y="431" fill="#365f79" font-size="17">JavaScript / Chart.js</text>

    <rect x="40" y="360" width="240" height="100" rx="7" fill="#fff" stroke="#aebfca"/>
    <text x="160" y="403" fill="#142c3b" font-size="21" font-weight="700">Acompanhamento</text>
    <text x="160" y="431" fill="#466575" font-size="17">Leituras e alertas</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#466575">
    <path d="M40 502H88" fill="none" stroke="#466575" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="102" y="508">Integração física prevista na proposta; firmware não incluído neste repositório.</text>
  </g>
</svg>
